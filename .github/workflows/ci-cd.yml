name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lemn-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require changesets for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            pnpm changeset:status --since=origin/main
            exit 0
          fi

          if git diff --quiet origin/main...HEAD -- packages/ui; then
            exit 0
          fi

          node scripts/release/check-unpublished-package-version.ts

      - name: Validate repo policy and release metadata
        run: pnpm validate

      - name: Validate release host DNS
        run: pnpm validate:release-hosts

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke showcase deployment locally
        run: pnpm smoke:showcase:local

      - name: Pack and install package smoke
        run: pnpm pack:ui

      - name: Verify generated files are committed
        run: git diff --exit-code

  showcase-e2e:
    name: Showcase E2E (${{ matrix.shard }}/3)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify E2E runner disk capacity
        run: node scripts/test/check-e2e-runner-capacity.mjs "$RUNNER_TEMP"

      - name: Install Chromium
        run: pnpm --filter @lemn-ltd/ui-showcase exec playwright install --with-deps chromium

      - name: Run showcase E2E shard
        run: >-
          pnpm --filter @lemn-ltd/ui-showcase exec playwright test
          --project=behavior
          --project=visual-light-mobile
          --project=visual-light-tablet
          --project=visual-light-desktop
          --project=visual-dark-mobile
          --project=visual-dark-tablet
          --project=visual-dark-desktop
          --shard=${{ matrix.shard }}/3

  showcase-accessibility:
    name: Showcase Accessibility
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        run: pnpm --filter @lemn-ltd/ui-showcase exec playwright install --with-deps chromium

      - name: Run showcase accessibility crawl
        run: pnpm --filter @lemn-ltd/ui-showcase exec playwright test --project=accessibility

  release-and-deploy:
    name: Release And Deploy
    needs: [validate, showcase-e2e, showcase-accessibility]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight Cloudflare release access
        id: cloudflare
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo '::error::Missing production Environment secret PRODUCTION_CLOUDFLARE_API_TOKEN. Required account-owned Cloudflare token grants: Account "Lemn DEV" -> Workers Scripts: Edit; Zone "le-mn.com" -> Zone: Read.' >&2
            exit 1
          fi
          for name in PRODUCTION_STATUS_TOKEN ROLLBACK_STATUS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production environment secret: ${name}" >&2
              exit 1
            fi
          done
          pnpm release:preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          PRODUCTION_STATUS_TOKEN: ${{ secrets.PRODUCTION_STATUS_TOKEN }}
          ROLLBACK_STATUS_TOKEN: ${{ secrets.STATUS_TOKEN || secrets.PRODUCTION_STATUS_TOKEN }}

      - name: Prepare or resume release metadata
        id: release
        run: pnpm prepare:ui:release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Build package
        run: pnpm --filter @lemn-ltd/ui run build

      - name: Build and smoke showcase deployment locally
        run: pnpm smoke:showcase:local

      - name: Publish or verify exact package
        run: pnpm publish:ui:release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        run: pnpm --filter @lemn-ltd/ui-docs run build
        env:
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.version }}
          PUBLIC_BUILD_GIT_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_BUILD_TIME: ${{ steps.release.outputs.time }}

      - name: Deploy docs
        run: pnpm deploy:docs:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.docs_account_id }}
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.version }}
          PUBLIC_BUILD_GIT_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_BUILD_TIME: ${{ steps.release.outputs.time }}

      - name: Roll out showcase with protected rollback
        run: pnpm rollout:showcase:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.showcase_account_id }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          EXPECTED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_RELEASE_GIT_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_RELEASE_TIME: ${{ steps.release.outputs.time }}
          PRODUCTION_STATUS_TOKEN: ${{ secrets.PRODUCTION_STATUS_TOKEN }}
          ROLLBACK_STATUS_TOKEN: ${{ secrets.STATUS_TOKEN || secrets.PRODUCTION_STATUS_TOKEN }}
