name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appranks-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require changesets for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            pnpm changeset status --since=origin/main
            exit 0
          fi

          if git diff --quiet origin/main...HEAD -- packages/ui; then
            exit 0
          fi

          node scripts/release/check-unpublished-package-version.ts

      - name: Validate repo policy and release metadata
        run: pnpm validate

      - name: Validate release host DNS
        run: pnpm validate:release-hosts

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack and install package smoke
        run: pnpm pack:ui

      - name: Verify generated files are committed
        run: git diff --exit-code

  release-and-deploy:
    name: Release And Deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release preconditions
        run: pnpm validate:release-preconditions

      - name: Preflight Cloudflare release access
        id: cloudflare
        run: pnpm preflight:cloudflare:release
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

      - name: Detect pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages from changesets
        if: steps.changesets.outputs.has_pending == 'true'
        run: pnpm version:packages

      - name: Commit release metadata
        if: steps.changesets.outputs.has_pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages/ui/package.json packages/ui/CHANGELOG.md apps/docs/src/content/docs/changelog/index.mdx apps/docs/src/content/docs/es/changelog/index.mdx
          if git diff --cached --quiet; then
            echo "No release metadata changed."
          else
            git commit -m "chore: release packages [skip ci]"
          fi

      - name: Capture release metadata
        id: release
        run: |
          package_version="$(node -p "require('./packages/ui/package.json').version")"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Push release metadata
        if: steps.changesets.outputs.has_pending == 'true'
        run: git push origin HEAD:main

      - name: Build package
        run: pnpm --filter @lemn-ltd/ui run build

      - name: Check package publication status
        id: package-version
        run: node scripts/release/check-unpublished-package-version.ts --github-output
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package if needed
        if: steps.package-version.outputs.published == 'false'
        run: pnpm publish:ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        run: pnpm --filter @appranks/ui-docs run build
        env:
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.version }}
          PUBLIC_BUILD_GIT_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_BUILD_TIME: ${{ steps.release.outputs.time }}

      - name: Deploy docs
        run: pnpm --dir apps/docs exec wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.docs_account_id }}

      - name: Build showcase
        run: pnpm --filter @appranks/ui-showcase run cf:build
        env:
          CLOUDFLARE_ENV: production

      - name: Deploy showcase
        run: >-
          pnpm --dir apps/showcase exec wrangler deploy --config wrangler.jsonc --env production
          --var BUILD_VERSION:${{ steps.release.outputs.version }}
          --var BUILD_GIT_SHA:${{ steps.release.outputs.sha }}
          --var BUILD_TIME:${{ steps.release.outputs.time }}
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.showcase_account_id }}

      - name: Set showcase runtime secret
        run: printf '%s' "$STATUS_TOKEN" | pnpm --dir apps/showcase exec wrangler secret put STATUS_TOKEN --config wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.showcase_account_id }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}

      - name: Smoke Cloudflare deployment mappings
        run: pnpm smoke:cloudflare:release
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

      - name: Smoke public endpoints
        run: pnpm smoke:release:production
        env:
          EXPECTED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_RELEASE_GIT_SHA: ${{ steps.release.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### Docs - UI"
            echo ""
            echo "- Package: \`@lemn-ltd/ui@${{ steps.release.outputs.version }}\`"
            echo "- Docs: https://ui.lemn.ai"
            echo "- Showcase: https://showcase.ui.lemn.ai"
            echo "- Catalog: https://showcase.ui.lemn.ai/catalog.json"
            echo "- Agent guide: https://showcase.ui.lemn.ai/llms.txt"
            echo "- Commit: \`${{ steps.release.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
