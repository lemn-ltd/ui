name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appranks-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require changesets for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main

      - name: Validate repo policy and release metadata
        run: pnpm validate

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack and install package smoke
        run: pnpm pack:ui

      - name: Verify generated files are committed
        run: git diff --exit-code

  release-and-deploy:
    name: Release And Deploy
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages from changesets
        if: steps.changesets.outputs.has_pending == 'true'
        run: pnpm version:packages

      - name: Commit release metadata
        if: steps.changesets.outputs.has_pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages/ui/package.json packages/ui/CHANGELOG.md apps/docs/src/content/docs/changelog/index.mdx apps/docs/src/content/docs/es/changelog/index.mdx
          if git diff --cached --quiet; then
            echo "No release metadata changed."
          else
            git commit -m "chore: release packages [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build package
        run: pnpm --filter @lemn-ltd/ui run build

      - name: Publish package if needed
        run: |
          version="$(node -p "require('./packages/ui/package.json').version")"
          package_name="$(node -p "require('./packages/ui/package.json').name")"
          package_scope="${package_name%%/*}"
          package_scope="${package_scope#@}"
          package_basename="${package_name##*/}"
          owner_scope="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          owner_package="@${owner_scope}/${package_basename}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1 || npm view "${owner_package}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} already published"
            exit 0
          fi
          if [ "${package_scope}" != "${owner_scope}" ]; then
            echo "::warning title=Package publish skipped::${package_name}@${version} cannot be published to GitHub Packages with GITHUB_TOKEN from ${GITHUB_REPOSITORY}. The package scope must match repository owner ${owner_scope}, or a dedicated registry token for ${package_scope} must be configured."
            {
              echo "### Package publish skipped"
              echo ""
              echo "- Package: \`${package_name}@${version}\`"
              echo "- Repository owner: \`${owner_scope}\`"
              echo "- Package scope: \`${package_scope}\`"
              echo "- Action: align the package scope with the repo owner, or configure a dedicated registry token for the package scope."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm publish:ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build metadata
        id: build
        run: |
          package_version="$(node -p "require('./packages/ui/package.json').version")"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build docs
        run: pnpm --filter @appranks/ui-docs run build

      - name: Deploy docs
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy

      - name: Build showcase
        run: pnpm --filter @appranks/ui-showcase run cf:build
        env:
          CLOUDFLARE_ENV: production

      - name: Deploy showcase
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/showcase
          environment: production
          command: deploy --env production --var BUILD_VERSION:${{ steps.build.outputs.version }} --var BUILD_GIT_SHA:${{ steps.build.outputs.sha }} --var BUILD_TIME:${{ steps.build.outputs.time }}

      - name: Set showcase runtime secret
        run: printf '%s' "$STATUS_TOKEN" | pnpm --dir apps/showcase exec wrangler secret put STATUS_TOKEN --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}

      - name: Smoke public endpoints
        run: |
          retry() {
            label="$1"
            shift
            for attempt in $(seq 1 30); do
              if "$@"; then
                echo "OK ${label}"
                return 0
              fi
              sleep 2
            done
            echo "Failed after 60s: ${label}" >&2
            return 1
          }

          retry docs-home sh -c 'curl --fail --silent --max-time 5 https://ui.appranks.com/ | grep -q "Docs - UI"'
          retry docs-changelog sh -c 'curl --fail --silent --max-time 5 https://ui.appranks.com/changelog/ | grep -q "Current package version"'
          retry showcase-health sh -c 'curl --fail --silent --max-time 5 https://showcase.ui.appranks.com/health | jq -e ".ok == true" >/dev/null'
          retry showcase-ready sh -c 'curl --fail --silent --max-time 5 https://showcase.ui.appranks.com/health/ready | jq -e ".ok == true" >/dev/null'
          retry showcase-catalog sh -c 'curl --fail --silent --max-time 5 https://showcase.ui.appranks.com/catalog.json | jq -e ".package == \"@lemn-ltd/ui\" and (.components | length) > 0" >/dev/null'
          retry showcase-llms sh -c 'curl --fail --silent --max-time 5 https://showcase.ui.appranks.com/llms.txt | grep -q "@lemn-ltd/ui"'
          retry showcase-llms-full sh -c 'curl --fail --silent --max-time 5 https://showcase.ui.appranks.com/llms-full.txt | grep -q "Appranks UI Component Catalog"'

      - name: Summary
        run: |
          {
            echo "### Docs - UI"
            echo ""
            echo "- Package: \`@lemn-ltd/ui@${{ steps.build.outputs.version }}\`"
            echo "- Docs: https://ui.appranks.com"
            echo "- Showcase: https://showcase.ui.appranks.com"
            echo "- Catalog: https://showcase.ui.appranks.com/catalog.json"
            echo "- Agent guide: https://showcase.ui.appranks.com/llms.txt"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
