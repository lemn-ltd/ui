name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Release the complete package set or one exact package
        required: true
        default: package-set
        type: choice
        options:
          - package-set
          - "@lemn-ltd/brand-contract"
          - "@lemn-ltd/ui"
          - "@lemn-ltd/brand-runtime"
          - "@lemn-ltd/brand-studio"

permissions:
  contents: read

concurrency:
  group: lemn-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild approved dependencies without registry credentials
        run: env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN pnpm rebuild --pending

      - name: Require changesets for package changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            pnpm changeset:status --since=origin/main
            exit 0
          fi

          if git diff --quiet origin/main...HEAD -- packages/brand-contract packages/ui packages/brand-runtime packages/brand-studio; then
            exit 0
          fi

          node scripts/release/check-unpublished-package-version.ts

      - name: Run the same standard validation profile used locally
        run: pnpm validate:standard
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

  ui-portal-e2e:
    name: UI Portal E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild approved dependencies without registry credentials
        run: env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN pnpm rebuild --pending

      - name: Free runner disk for pinned Playwright image
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force

      - name: Verify E2E runner disk capacity
        run: node scripts/test/check-e2e-runner-capacity.mjs "$RUNNER_TEMP"

      - name: Pull pinned Playwright image
        run: docker pull mcr.microsoft.com/playwright:v1.60.0-noble

      - name: Run UI Portal E2E shard
        run: |
          status=0
          docker run --rm --ipc=host \
            --env CI=true \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            sh -lc 'corepack enable && pnpm --filter @lemn-ltd/ui-portal exec playwright test \
              --project=behavior \
              --project=visual-light-mobile \
              --project=visual-light-tablet \
              --project=visual-light-desktop \
              --project=visual-dark-mobile \
              --project=visual-dark-tablet \
              --project=visual-dark-desktop \
              --workers=2 \
              --shard=${{ matrix.shard }}/2' || status=$?
          sudo chown -R "$(id -u):$(id -g)" \
            apps/ui-portal/test-results \
            apps/ui-portal/playwright-report 2>/dev/null || true
          exit "$status"

  ui-portal-accessibility:
    name: UI Portal Accessibility (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild approved dependencies without registry credentials
        run: env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN pnpm rebuild --pending

      - name: Install Chromium
        run: pnpm --filter @lemn-ltd/ui-portal exec playwright install --with-deps chromium

      - name: Run UI Portal accessibility crawl
        run: pnpm --filter @lemn-ltd/ui-portal exec playwright test --project=accessibility --workers=2 --shard=${{ matrix.shard }}/2

  publish-package:
    name: Publish ${{ inputs.package }}
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.package != 'package-set'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild approved dependencies without registry credentials
        run: env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN pnpm rebuild --pending

      - name: Require a clean release revision
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Build release packages in dependency order
        run: pnpm build:packages:release

      - name: Verify generated release revision remains clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Publish or verify selected immutable package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: pnpm publish:packages:release --package "${RELEASE_PACKAGE}"

      - name: Smoke exact releases in a clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm smoke:packages:github-packages

  release-and-deploy:
    name: Release And Deploy
    needs: [validate, ui-portal-e2e, ui-portal-accessibility]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.package == 'package-set'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lemn-ltd"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild approved dependencies without registry credentials
        run: env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN pnpm rebuild --pending

      - name: Validate release preconditions
        run: pnpm release:preflight

      - name: Preflight Cloudflare release access
        id: cloudflare
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo '::error::Missing production Environment secret PRODUCTION_CLOUDFLARE_API_TOKEN. Required account-owned Cloudflare token grants: Account "Lemn DEV" -> Workers Scripts: Edit; Zone "le-mn.com" -> Zone: Read, Workers Routes: Edit.' >&2
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error::PRODUCTION_CLOUDFLARE_ACCOUNT_ID must be an exact 32-character lowercase hexadecimal protected Environment variable' >&2
            exit 1
          fi
          for name in UI_PORTAL_ACCESS_CLIENT_ID UI_PORTAL_ACCESS_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production Environment secret: PRODUCTION_${name}" >&2
              exit 1
            fi
          done
          if [ "${UI_PORTAL_ACCESS_CLIENT_ID}" = "${UI_PORTAL_ACCESS_CLIENT_SECRET}" ]; then
            echo '::error::UI Portal Access client ID and secret must be distinct' >&2
            exit 1
          fi
          for name in PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE; do
            if [[ ! "${!name}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::${name} must be an exact 64-character lowercase hexadecimal protected Environment variable" >&2
              exit 1
            fi
          done
          if [ "${PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE}" = "${PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE}" ]; then
            echo '::error::UI Portal Admin and health Access audiences must be distinct' >&2
            exit 1
          fi
          env \
            -u UI_PORTAL_ACCESS_CLIENT_ID \
            -u UI_PORTAL_ACCESS_CLIENT_SECRET \
            -u PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE \
            -u PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE \
            pnpm preflight:cloudflare:release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          UI_PORTAL_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_UI_PORTAL_ACCESS_CLIENT_ID }}
          UI_PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_UI_PORTAL_ACCESS_CLIENT_SECRET }}
          PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE: ${{ vars.PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE }}
          PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE: ${{ vars.PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE }}

      - name: Prepare or resume release metadata
        id: release
        run: pnpm prepare:packages:release
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Install exact prepared release revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_RELEASE_GIT_SHA}" ]; then
            echo '::error::The checked-out release revision does not match the immutable release SHA produced by preparation' >&2
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
          pnpm install --frozen-lockfile --ignore-scripts
          env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN pnpm rebuild --pending
        env:
          EXPECTED_RELEASE_GIT_SHA: ${{ steps.release.outputs.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate exact prepared release revision
        run: |
          pnpm validate
          pnpm check
          pnpm test
          pnpm build

      - name: Audit release dependency graph
        run: pnpm audit --prod

      - name: Dry-run Cloudflare deployables
        run: |
          pnpm --filter @lemn-ltd/ui-portal run cf:dry-run
          pnpm --filter @lemn-ltd/ui-docs run cf:dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.portal_account_id }}
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.version }}
          PUBLIC_BUILD_GIT_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_BUILD_TIME: ${{ steps.release.outputs.time }}

      - name: Build release packages in dependency order
        run: pnpm build:packages:release

      - name: Build and smoke UI Portal deployment locally
        run: pnpm smoke:portal:local

      - name: Publish or verify exact package set
        run: pnpm publish:packages:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact published package set in a clean consumer
        run: pnpm smoke:packages:github-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        run: pnpm --filter @lemn-ltd/ui-docs run build
        env:
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.version }}
          PUBLIC_BUILD_GIT_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_BUILD_TIME: ${{ steps.release.outputs.time }}

      - name: Roll out UI Portal with protected rollback
        run: pnpm rollout:portal:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.portal_account_id }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          EXPECTED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_RELEASE_GIT_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_RELEASE_TIME: ${{ steps.release.outputs.time }}
          UI_PORTAL_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_UI_PORTAL_ACCESS_CLIENT_ID }}
          UI_PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_UI_PORTAL_ACCESS_CLIENT_SECRET }}
          PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE: ${{ vars.PRODUCTION_UI_PORTAL_ACCESS_AUDIENCE }}
          PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE: ${{ vars.PRODUCTION_UI_PORTAL_HEALTH_ACCESS_AUDIENCE }}

      - name: Deploy docs
        run: pnpm deploy:docs:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.docs_account_id }}
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.version }}
          PUBLIC_BUILD_GIT_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_BUILD_TIME: ${{ steps.release.outputs.time }}

      - name: Smoke released production identity
        run: pnpm smoke:release:production
        env:
          EXPECTED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_RELEASE_GIT_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_RELEASE_TIME: ${{ steps.release.outputs.time }}
          UI_PORTAL_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_UI_PORTAL_ACCESS_CLIENT_ID }}
          UI_PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_UI_PORTAL_ACCESS_CLIENT_SECRET }}
